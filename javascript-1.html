<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>자바스크립트란?</h1>
    <p>동적 움직임을 만들 때 쓰는 겁니다.</p>
    <p>자바스크립트는 화면에 모든 움직임을 담당합니다.</p>
    <p>자바스크립트는 대부분 /body 태그 위에 코드를 작성합니다.</p>

    <button class="btn">클릭</button>
    <script>
        // 변수
        // 변수는 let const 두가지 있습니다.
        // 예전에 변수명은 var
        const btn = document.querySelector('.btn');
    </script>
</body>
</html>
